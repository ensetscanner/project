<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EnsetScan Vision logo">
  <defs>
    <linearGradient id="ensetBack" x1="38" y1="20" x2="38" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="ensetFront" x1="50" y1="10" x2="50" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="ensetRight" x1="60" y1="22" x2="60" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Soil mound -->
  <ellipse cx="50" cy="92" rx="46" ry="9" fill="#14532d"/>

  <!-- Back leaf (left clump) -->
  <path d="M38 20 C 46 44, 48 64, 38 80 C 30 84, 28 70, 28 52 C 27 34, 30 24, 38 20 Z"
        fill="url(#ensetBack)"/>
  <path d="M38 32 L38 74" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Front (main) enset leaf -->
  <path d="M50 86 C 72 78, 82 56, 74 34 C 70 16, 58 10, 50 10 C 42 10, 30 16, 26 34 C 18 56, 28 78, 50 86 Z"
        fill="url(#ensetFront)"/>
  <path d="M50 82 C 50 60, 50 38, 50 14" stroke="#b9f6ca" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Secondary veins -->
  <path d="M50 68 C 44 64, 38 64, 33 66" stroke="#a5d6a7" stroke-width="1.6" fill="none" opacity="0.7"/>
  <path d="M50 48 C 43 44, 36 45, 31 48" stroke="#a5d6a7" stroke-width="1.6" fill="none" opacity="0.7"/>
  <path d="M50 28 C 44 25, 38 26, 34 29" stroke="#a5d6a7" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M50 68 C 56 64, 62 64, 67 66" stroke="#a5d6a7" stroke-width="1.6" fill="none" opacity="0.7"/>
  <path d="M50 48 C 57 44, 64 45, 69 48" stroke="#a5d6a7" stroke-width="1.6" fill="none" opacity="0.7"/>
  <path d="M50 28 C 56 25, 62 26, 66 29" stroke="#a5d6a7" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Right accent leaf -->
  <path d="M60 22 C 66 42, 68 60, 60 78 C 54 81, 53 68, 54 52 C 54 36, 56 26, 60 22 Z"
        fill="url(#ensetRight)" opacity="0.95"/>
  <path d="M60 32 L60 72" stroke="#b9f6ca" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Soft highlight on the main leaf -->
  <path d="M46 80 C 42 62, 43 42, 46 18" stroke="#ffffff" stroke-width="1.4" fill="none" opacity="0.25" stroke-linecap="round"/>
</svg>